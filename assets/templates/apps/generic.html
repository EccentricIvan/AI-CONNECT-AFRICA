<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--primary:{{primary}};--ink:#151826;--muted:#757c90;--line:#e9ecf3;--wash:#f5f6fa}
*{margin:0;box-sizing:border-box}
body{
  font-family:'Segoe UI',system-ui,Arial,sans-serif;color:var(--ink);
  background:#e8eaf1;display:flex;justify-content:center;padding:20px 12px;min-height:100vh
}
.phone{
  width:100%;max-width:400px;background:#fff;border-radius:34px;overflow:hidden;
  box-shadow:0 26px 60px rgba(21,24,38,.2);display:flex;flex-direction:column
}
.status{
  display:flex;justify-content:space-between;padding:13px 22px 6px;
  font-size:12px;font-weight:700;color:#fff;background:var(--primary)
}
.hero{background:var(--primary);color:#fff;padding:8px 22px 28px}
.who{display:flex;align-items:center;gap:11px;margin-bottom:18px}
.logo{
  width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.2);
  display:grid;place-items:center;font-size:20px;font-weight:800
}
.who .nm{font-size:19px;font-weight:800}
.who .sub{font-size:11px;opacity:.85;margin-top:2px}
.who .bell{margin-left:auto;font-size:16px;opacity:.9}
.hero p{font-size:13px;opacity:.9;line-height:1.55}

.body{padding:20px;flex:1}
.stats{display:grid;gap:10px;grid-template-columns:1fr 1fr 1fr;margin-bottom:20px}
.stat{background:var(--wash);border-radius:15px;padding:13px;text-align:center}
.stat .v{font-size:19px;font-weight:800;color:var(--primary)}
.stat .l{font-size:10px;color:var(--muted);margin-top:3px}

h2{font-size:15px;margin-bottom:11px}
ul{list-style:none;display:flex;flex-direction:column;gap:9px}
li{
  display:flex;align-items:center;gap:11px;font-size:13px;font-weight:600;
  border:1px solid var(--line);border-radius:14px;padding:13px
}
li::before{
  content:'✓';width:22px;height:22px;border-radius:7px;background:var(--wash);
  color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:12px;
  flex-shrink:0
}

.cta{
  margin-top:20px;background:var(--primary);color:#fff;border:none;width:100%;
  border-radius:14px;padding:15px;font-size:14px;font-weight:800;cursor:pointer
}

.nav{
  display:flex;justify-content:space-around;padding:13px 8px 18px;
  border-top:1px solid var(--line)
}
.nav div{font-size:19px;opacity:.35}
.nav div.on{opacity:1;color:var(--primary)}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span>▮▮▮ ⚡</span></div>

  <div class="hero">
    <div class="who">
      <div class="logo">{{initial}}</div>
      <div>
        <div class="nm">{{app_name}}</div>
        <div class="sub">{{type_name}}</div>
      </div>
      <div class="bell">🔔</div>
    </div>
    <p>{{purpose}}</p>
  </div>

  <div class="body">
    <div class="stats">
      <div class="stat"><div class="v">{{stat1}}</div><div class="l">Today</div></div>
      <div class="stat"><div class="v">{{stat2}}</div><div class="l">This week</div></div>
      <div class="stat"><div class="v">{{stat3}}</div><div class="l">Total</div></div>
    </div>

    <h2>What this app does</h2>
    {{features}}

    <button class="cta" type="button" id="cta">Open {{app_name}}</button>
  </div>

  <div class="nav">
    <div class="on">🏠</div><div>📋</div><div>➕</div><div>👤</div>
  </div>
</div>

<script>
document.getElementById('cta')?.addEventListener('click', function () {
  this.textContent = '{{app_name}} is running ✓';
});
</script>
</body>
</html>
