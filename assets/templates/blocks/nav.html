<header class="nav">
  <div class="wrap nav__in">
    <a class="nav__brand" href="#top"><span class="nav__mark">{{initial}}</span>{{site_name}}</a>
    <nav class="nav__links">{{nav_links}}</nav>
    <a class="btn btn--primary nav__cta" href="#contact">{{cta_label}}</a>
  </div>
</header>
<style>
.nav { position: sticky; top: 0; z-index: 50; background: rgba(255,255,255,.82);
  backdrop-filter: saturate(160%) blur(14px); border-bottom: 1px solid var(--line); }
.nav__in { display: flex; align-items: center; gap: 20px; height: 70px; }
.nav__brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: -.01em; }
.nav__mark { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center;
  color: #fff; font-size: 15px; background: linear-gradient(140deg, var(--brand), var(--brand-2)); }
.nav__links { display: flex; gap: 26px; margin-left: auto; font-size: 15px; color: var(--ink-2); font-weight: 550; }
.nav__links a:hover { color: var(--brand); }
.nav__cta { padding: 10px 20px; font-size: 14px; }
@media (max-width: 820px) { .nav__links { display: none; } .nav__cta { margin-left: auto; } }
</style>
