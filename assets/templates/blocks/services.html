<section class="section section--tint" id="services">
  <div class="wrap">
    <div class="head head--center">
      <span class="eyebrow">{{services_eyebrow}}</span>
      <h2>{{services_title}}</h2>
      <p>{{services_intro}}</p>
    </div>
    <div class="grid grid--2">
      <div class="card svc"><div class="chip chip--soft">01</div><div><h3>{{service1_title}}</h3><p>{{service1_text}}</p></div></div>
      <div class="card svc"><div class="chip chip--soft">02</div><div><h3>{{service2_title}}</h3><p>{{service2_text}}</p></div></div>
      <div class="card svc"><div class="chip chip--soft">03</div><div><h3>{{service3_title}}</h3><p>{{service3_text}}</p></div></div>
      <div class="card svc"><div class="chip chip--soft">04</div><div><h3>{{service4_title}}</h3><p>{{service4_text}}</p></div></div>
    </div>
  </div>
</section>
<style>
.svc { display: flex; gap: 18px; align-items: flex-start; }
.svc .chip { margin-bottom: 0; flex: 0 0 auto; font-size: 14px; }
</style>
