<section class="section section--tint" id="team">
  <div class="wrap">
    <div class="head head--center">
      <span class="eyebrow">{{team_eyebrow}}</span>
      <h2>{{team_title}}</h2>
    </div>
    <div class="grid grid--4">
      <div class="card person"><span class="ava ava--lg">{{person1_initial}}</span><h3>{{person1_name}}</h3><p class="muted">{{person1_role}}</p></div>
      <div class="card person"><span class="ava ava--lg">{{person2_initial}}</span><h3>{{person2_name}}</h3><p class="muted">{{person2_role}}</p></div>
      <div class="card person"><span class="ava ava--lg">{{person3_initial}}</span><h3>{{person3_name}}</h3><p class="muted">{{person3_role}}</p></div>
      <div class="card person"><span class="ava ava--lg">{{person4_initial}}</span><h3>{{person4_name}}</h3><p class="muted">{{person4_role}}</p></div>
    </div>
  </div>
</section>
<style>
.person { text-align: center; }
.ava--lg { width: 62px; height: 62px; font-size: 22px; margin: 0 auto 14px; }
</style>
