<section class="section" id="features">
  <div class="wrap">
    <div class="head head--center">
      <span class="eyebrow">{{features_eyebrow}}</span>
      <h2>{{features_title}}</h2>
      <p>{{features_intro}}</p>
    </div>
    <div class="grid grid--3">
      <div class="card"><div class="chip">1</div><h3>{{feature1_title}}</h3><p>{{feature1_text}}</p></div>
      <div class="card"><div class="chip">2</div><h3>{{feature2_title}}</h3><p>{{feature2_text}}</p></div>
      <div class="card"><div class="chip">3</div><h3>{{feature3_title}}</h3><p>{{feature3_text}}</p></div>
    </div>
  </div>
</section>
